apiVersion: v1
clusters:
- cluster:
    certificate-authority-data: 
    server: https://192.168.11.10:6443
  name: local-k3s
contexts:
- context:
    cluster: local-k3s
    user: my-auth-user
  name: test-context
current-context: test-context
kind: Config
preferences: {}
users:
- name: my-auth-user
  user:
    exec:
      apiVersion: client.authentication.k8s.io/v1
      command: "./bin/test-auth-plugin"
      env:
      - name: "KUBE_AUTH_ISSUER_URL"
        value: "http://localhost:8080"
      - name: "KUBE_AUTH_TOKEN_URL"
        value: "http://localhost:8080/oauth/token"
      - name: "KUBE_AUTH_AUDIENCE"
        value: "kubernetes-api"
      - name: "KUBE_AUTH_CACHE_PATH"
        value: "/home/ksoroi/.kube/cache/auth-plugin/tokens.json"
      provideClusterInfo: false
      interactiveMode: Never